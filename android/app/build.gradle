plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "ie.thecollegeview.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "ie.thecollegeview.app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("key.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystorePropertiesFile.withReader("UTF-8") { reader ->
                    keystoreProperties.load(reader)
                }
            }

            def resolvedStoreFile = keystoreProperties.getProperty("storeFile")
                ?: localProperties.getProperty("MYAPP_RELEASE_STORE_FILE")
                ?: System.getenv("ANDROID_KEYSTORE_PATH")
            def resolvedStorePassword = keystoreProperties.getProperty("storePassword")
                ?: localProperties.getProperty("MYAPP_RELEASE_STORE_PASSWORD")
                ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def resolvedKeyAlias = keystoreProperties.getProperty("keyAlias")
                ?: localProperties.getProperty("MYAPP_RELEASE_KEY_ALIAS")
                ?: System.getenv("ANDROID_KEY_ALIAS")
            def resolvedKeyPassword = keystoreProperties.getProperty("keyPassword")
                ?: localProperties.getProperty("MYAPP_RELEASE_KEY_PASSWORD")
                ?: System.getenv("ANDROID_KEY_PASSWORD")

            if (resolvedStoreFile) {
                storeFile file(resolvedStoreFile)
                storePassword resolvedStorePassword
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                def isBundleRelease = gradle.startParameter.taskNames.any {
                    it.toLowerCase().contains("bundlerelease")
                }
                if (isBundleRelease) {
                    throw new GradleException(
                        "Release keystore not configured for Play Store App Bundle (.aab). " +
                        "Copy android/key.properties.example to android/key.properties and fill in your upload keystore details."
                    )
                }
                // Allow local `flutter run --release` / `flutter build apk --release` testing using debug signing
                signingConfig signingConfigs.debug
            }

            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
